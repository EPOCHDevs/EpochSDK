name: Shared SDK contract

on:
  pull_request:
    paths: ['contracts/**', 'tools/**', 'python/epoch-sdk/**', '.github/workflows/contracts.yml']
  push:
    branches: [main]
    paths: ['contracts/**', 'tools/**', 'python/epoch-sdk/**', '.github/workflows/contracts.yml']

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema[format]>=4.23,<5' 'openapi-spec-validator>=0.7,<0.9'
      - run: python tools/validate_contract.py
      - run: python tools/sync_native_parameters.py --check
      - run: python tools/validate_saved_output_contract.py
      - run: python -m compileall -q python/epoch-sdk/src
