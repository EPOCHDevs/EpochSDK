name: Shared SDK contract

on:
  pull_request:
    paths: ['contracts/**', 'tools/**', 'fern-shares/**', 'fern-models/**', 'python/epoch-sdk/**', 'typescript/epoch-sdk/**', 'examples/notebooks/**', '.github/workflows/contracts.yml']
  push:
    branches: [main]
    paths: ['contracts/**', 'tools/**', 'fern-shares/**', 'fern-models/**', 'python/epoch-sdk/**', 'typescript/epoch-sdk/**', 'examples/notebooks/**', '.github/workflows/contracts.yml']

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema[format]>=4.23,<5' 'openapi-spec-validator>=0.7,<0.9'
      - run: python tools/validate_contract.py
      - run: python tools/validate_public_contract.py
      - run: python tools/sync_native_parameters.py --check
      - run: python tools/sync_platform_files_contract.py --check
      - run: python tools/generate_files_api.py --check
      - run: python tools/sync_platform_shares_contract.py --check
      - run: python tools/generate_shares_api.py --check
      - run: python tools/sync_platform_models_contract.py --check
      - run: python tools/generate_models_api.py --check
      - run: python tools/sync_typescript_workflow_schemas.py --check
      - run: python tools/validate_saved_output_contract.py
      - run: python tools/validate_research_response_contract.py
      - run: python tools/validate_research_workflow_contract.py
      - run: python tools/validate_session_contract.py
      - run: python tools/validate_notebook_cases.py
      - run: python tools/generate_demo_notebooks.py --check
      - run: python tools/generate_report_notebooks.py --check
      - run: python -m compileall -q python/epoch-sdk/src

  standalone-typescript-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Native distributions are private. Backend's release conformance step
      # runs all Python and TypeScript tests with its exact generated packages.
      # These standalone clients need no private native package or credential.
      - run: npm install --ignore-scripts --package-lock=false --prefix typescript/epoch-sdk
      - run: node --test typescript/epoch-sdk/test/{api,discovery-presentation,discovery,files,files-api,shares-api,models-api,identity}.test.mjs
      - run: npm run --prefix typescript/epoch-sdk test:shares-types
      - run: npm run --prefix typescript/epoch-sdk test:models-types
