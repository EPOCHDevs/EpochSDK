name: Publish epoch-sdk to PyPI
# Runs when a tag epoch-sdk-v<version> is pushed on a commit that is on dev; <version> must be that
# commit's pyproject version. The upload waits in the pypi environment, which accepts only these tags,
# for the maintainer's approval. PyPI trusts this workflow (trusted publishing), so no token is stored.
# Its dependencies, stratifyx and epoch-source-connections, are published by EpochBackend's own PyPI
# workflow and must be on PyPI first.
on:
  push:
    tags: ['epoch-sdk-v*']
permissions:
  contents: read
concurrency:
  group: publish-pypi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        name: Require a dev commit whose version is the tag's, and one PyPI doesn't have
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor HEAD origin/dev; then echo "$TAG is not on dev" >&2; exit 1; fi
          version=$(python -c "import tomllib; print(tomllib.load(open('python/epoch-sdk/pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "epoch-sdk-v$version" ]; then echo "$TAG does not name the commit's version $version" >&2; exit 1; fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/epoch-sdk/$version/json")
          if [ "$status" = 200 ]; then echo "epoch-sdk $version is already on PyPI" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          python -m pip install 'build==1.2.2.post1' 'twine==6.1.0'
          python -m build python/epoch-sdk --outdir dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: epoch-sdk-dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/epoch-sdk/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: epoch-sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
