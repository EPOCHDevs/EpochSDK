name: Publish epoch-sdk to PyPI
# Started by hand for one commit on dev. PyPI trusts this workflow (trusted publishing), so no token
# is stored. Its dependencies, stratifyx and epoch-source-connections, are published by EpochBackend's
# own PyPI workflow and must be on PyPI first.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Exact commit on dev to publish; its pyproject version is released'
        required: true
permissions:
  contents: read
concurrency:
  group: publish-pypi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Require a commit on dev
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$COMMIT" origin/dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python -m pip install 'build==1.2.2.post1' 'twine==6.1.0'
          python -m build python/epoch-sdk --outdir dist
          python -m twine check --strict dist/*
      - id: version
        name: Refuse a version PyPI already has
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('python/epoch-sdk/pyproject.toml','rb'))['project']['version'])")
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/epoch-sdk/$version/json")
          if [ "$status" = 200 ]; then echo "epoch-sdk $version is already on PyPI" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: epoch-sdk-dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/epoch-sdk/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: epoch-sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
