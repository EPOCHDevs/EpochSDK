# Clients for Platform's saved-model contract (ENG-2755/2758), generated with the same Fern
# generator versions as EpochBackend's StratifyX SDK so method and type names match it.
# Regenerate with `python tools/generate_models_api.py`; never edit the output by hand.
api:
  specs:
    - openapi: openapi/platform-models.openapi.json
default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.46.6
        output:
          location: local-file-system
          path: ../build/fern-models/python
        config:
          package_name: models_api
          client_class_name: EpochModels
          client:
            exported_filename: client.py
          pydantic_config:
            version: v2
            use_pydantic_field_aliases: true
            # Responses keep fields Platform adds later, so a new response field never needs a
            # lockstep client release.
            extra_fields: allow
            enum_type: python_enums
      - name: fernapi/fern-typescript-node-sdk
        version: 0.51.7
        output:
          location: local-file-system
          path: ../build/fern-models/typescript
        config:
          namespaceExport: EpochModels
          allowCustomFetcher: true
          includeCredentialsOnCrossOriginRequests: true
          useBrandedStringAliases: true
          generateWireTests: false
          allowExtraFields: true
