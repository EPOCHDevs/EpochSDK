[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "epoch-sdk"
version = "0.1.0a54"
description = "Epoch integration contracts and client adapters over LangGraph and StratifyX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "jsonschema>=4.23,<5",
  "referencing>=0.36,<1",
  "httpx>=0.28,<1",
  "stratifyx>=3.3.0rc96,<4",
  "epoch-source-connections>=0.1.0a5,<0.2",
]

[project.urls]
Repository = "https://github.com/EPOCHDevs/EpochSDK"

[project.optional-dependencies]
clients = ["langgraph-sdk>=0.4.4,<0.5", "httpx>=0.28,<1"]
terminal = ["rich>=14,<15", "prompt-toolkit>=3,<4", "langgraph-sdk>=0.4.4,<0.5", "httpx>=0.28,<1", "pyarrow>=26,<27"]
notebook = ["ipywidgets>=8,<9", "ipython>=9,<10", "markdown-it-py>=4,<5", "langgraph-sdk>=0.4.4,<0.5", "httpx>=0.28,<1", "pyarrow>=26,<27"]
results = ["pyarrow>=26,<27"]
keychain = ["keyring>=25,<26"]
mcp = ["mcp>=2.3,<3", "langgraph-sdk>=0.4.4,<0.5", "httpx>=0.28,<1", "pyarrow>=26,<27"]
test = ["pytest>=8,<10"]

[project.scripts]
epoch-api-check = "epoch_sdk.capabilities:main"
epoch = "epoch_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epoch_sdk = ["py.typed", "data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live_discovery: opt-in real Backend and registered MCP acceptance", "live_space: opt-in native Files/Space SDK and fresh MCP acceptance", "live_run_outputs: opt-in real Backend and EpochAI run-output/edit acceptance"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated from Platform contracts by tools/generate_files_api.py and tools/generate_shares_api.py.
extend-exclude = ["src/epoch_sdk/files_api", "src/epoch_sdk/shares_api"]

[tool.pyright]
include = ["src"]
exclude = ["src/epoch_sdk/files_api", "src/epoch_sdk/shares_api"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
